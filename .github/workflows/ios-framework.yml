name: ios-framework
on:
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions
jobs:
  build:
    runs-on: macos-15       # Kotlin/Native para iOS solo compila en macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build iOS XCFramework
        run: gradle :composeApp:assembleComposeAppReleaseXCFramework
      - uses: actions/upload-artifact@v4
        with:
          name: ComposeApp.xcframework
          path: composeApp/build/XCFrameworks/release/ComposeApp.xcframework
          if-no-files-found: error

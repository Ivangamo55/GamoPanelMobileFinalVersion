name: ios-framework
on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build iOS XCFramework
        run: gradle :composeApp:assembleComposeAppReleaseXCFramework
      - uses: actions/upload-artifact@v4
        with:
          name: ComposeApp.xcframework
          path: composeApp/build/XCFrameworks/release/ComposeApp.xcframework
          if-no-files-found: error
  ios-app:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build XCFramework
        run: gradle :composeApp:assembleComposeAppReleaseXCFramework
      - name: Stage XCFramework
        run: cp -R composeApp/build/XCFrameworks/release/ComposeApp.xcframework iosApp/ComposeApp.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build simulator app
        working-directory: iosApp
        run: xcodebuild -project GamoPanel.xcodeproj -scheme GamoPanel -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: GamoPanel-iOS-simulator
          path: iosApp/build/Build/Products/Release-iphonesimulator/GamoPanel.app
          if-no-files-found: warn

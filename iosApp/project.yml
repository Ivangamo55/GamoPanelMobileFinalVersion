name: GamoPanel
options:
  bundleIdPrefix: space.gamoserver
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: space.gamoserver.gamopanel
    INFOPLIST_KEY_CFBundleDisplayName: GamoPanel
    INFOPLIST_KEY_NSFaceIDUsageDescription: GamoPanel usa Face ID para autenticarte con tu passkey.
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  GamoPanel:
    type: application
    platform: iOS
    sources:
      - path: Sources/GamoPanel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.gamoserver.gamopanel
        CODE_SIGN_ENTITLEMENTS: GamoPanel/GamoPanel.entitlements
    dependencies:
      - framework: ComposeApp.xcframework
        embed: false

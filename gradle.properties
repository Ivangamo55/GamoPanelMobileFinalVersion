# Memoria para Gradle/Kotlin (Compose Multiplatform es pesado).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Usar librerías AndroidX.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# En Windows/Linux los targets de iOS no se compilan: se omiten sin error.
# (Kotlin/Native para iOS solo compila en macOS; ver .github/workflows)
kotlin.native.ignoreDisabledTargets=true
